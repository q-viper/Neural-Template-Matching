<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Neural Template Matching Web Application using ONNX.js for real-time inference">
    <meta name="author" content="Neural Template Matching">
    <meta name="robots" content="index, follow">

    <title>Neural Template Matching - ONNX.js Web App</title>

    <!-- ONNX.js Runtime -->
    <script async src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.0/dist/ort.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            padding: 20px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 18px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            margin-bottom: 16px;
            font-size: 11px;
            text-align: center;
        }

        .upload-section {
            margin-bottom: 16px;
        }

        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .upload-item {
            display: flex;
            flex-direction: column;
        }

        .upload-label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
            font-size: 11px;
            text-align: center;
        }

        .preview-container {
            margin-top: 6px;
            height: 120px;
            width: 100%;
            border: 2px dashed #ddd;
            border-radius: 6px;
            background: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .preview-container.has-image {
            border-color: #667eea;
            border-style: solid;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
        }

        .preview-placeholder {
            color: #999;
            font-size: 10px;
            text-align: center;
            padding: 5px;
        }

        @media (max-width: 768px) {
            .upload-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-btn {
            display: block;
            width: 100%;
            padding: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .file-input-btn:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            border-color: rgba(102, 126, 234, 1);
            transform: translateY(-1px);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .button-group.single {
            grid-template-columns: 1fr;
        }

        button {
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 1px solid #dee2e6;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e9ecef;
            transform: translateY(-1px);
        }

        .status {
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: 500;
            font-size: 10px;
            display: none;
            text-align: center;
        }

        .status.show {
            display: block;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
            border: 1px solid #bbdefb;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
            border: 1px solid #c8e6c9;
        }

        .status.error {
            background: #ffebee;
            color: #d32f2f;
            border: 1px solid #ffcdd2;
        }

        .canvas-section {
            margin-top: 16px;
            display: none;
        }

        .canvas-section.show {
            display: block;
        }

        .canvas-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 11px;
            text-align: center;
        }

        .canvas-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .canvas-wrapper {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        canvas {
            display: block;
            width: 100%;
            height: 200px;
            object-fit: contain;
            background: #f8f9fa;
        }

        .canvas-label {
            padding: 4px 6px;
            background: #f8f9fa;
            color: #495057;
            font-size: 9px;
            font-weight: 600;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }

        .info-panel {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            border: 1px solid #e9ecef;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid #dee2e6;
            font-size: 9px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #6c757d;
            font-weight: 500;
        }

        .info-value {
            color: #495057;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #ccc;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            min-width: 250px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loading-text {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .settings {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px solid #e9ecef;
        }

        .setting-group {
            margin-bottom: 6px;
        }

        .setting-group:last-child {
            margin-bottom: 0;
        }

        .setting-label {
            display: block;
            font-size: 10px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 4px;
            text-align: center;
        }

        .setting-value {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="range"] {
            flex: 1;
            height: 3px;
            border-radius: 2px;
            background: #dee2e6;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .slider-value {
            min-width: 35px;
            text-align: right;
            font-weight: 600;
            color: #667eea;
            font-size: 10px;
            padding: 2px 4px;
            background: #e7f3ff;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }

            h1 {
                font-size: 18px;
            }

            .canvas-container {
                grid-template-columns: 1fr;
            }

            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎯 Temp Matching Segmentation</h1>
        <p class="subtitle">Upload two images: 1) Main image and 2) Template to find in the main image</p>

        <div class="upload-section">
            <div class="upload-grid">
                <div class="upload-item">
                    <label class="upload-label">Main Image (JPG/PNG)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="mainImageInput" accept="image/jpeg,image/png">
                        <button class="file-input-btn" onclick="document.getElementById('mainImageInput').click()">
                            📁 Select Main Image
                        </button>
                    </div>
                    <div class="preview-container" id="mainImagePreview"></div>
                </div>

                <div class="upload-item">
                    <label class="upload-label">Template Image (JPG/PNG)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="templateImageInput" accept="image/jpeg,image/png">
                        <button class="file-input-btn" onclick="document.getElementById('templateImageInput').click()">
                            🔍 Select Template
                        </button>
                    </div>
                    <div class="preview-container" id="templateImagePreview"></div>
                </div>
            </div>
            <p style="font-size: 9px; color: #6c757d; margin-top: 6px; text-align: center;">📋 Note: Place your
                model.onnx file in the same
                folder as this HTML file</p>
        </div>

        <div class="settings" id="settingsPanel" style="display:none;">
            <div class="setting-group">
                <label class="setting-label">Threshold</label>
                <div class="setting-value">
                    <input type="range" id="thresholdSlider" min="0" max="1" step="0.01" value="0.5">
                    <span class="slider-value" id="thresholdValue">0.50</span>
                </div>
            </div>
        </div>

        <div class="status" id="status"></div>

        <div class="button-group">
            <button class="btn-primary" id="runButton" onclick="runInference()" disabled>
                � Run Template Matching
            </button>
            <button class="btn-secondary" id="clearButton" onclick="clearAll()">
                🗑️ Clear
            </button>
        </div>

        <div class="canvas-section" id="canvasSection">
            <div class="canvas-title">Inference Results</div>
            <div class="canvas-container" id="inputCanvasContainer"></div>

            <div class="info-panel">
                <div class="info-row">
                    <span class="info-label">Model:</span>
                    <span class="info-value" id="infoModel">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Input Shape:</span>
                    <span class="info-value" id="infoInputShape">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Inference Time:</span>
                    <span class="info-value" id="infoTime">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Threshold:</span>
                    <span class="info-value" id="infoThreshold">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">🔄 Running neural network inference...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
